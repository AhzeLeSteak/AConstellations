<div [ngClass]="{mobile: isMobile, horizontal: isHorizontal}" class="hud">
  <input [(ngModel)]="scale.ratio" [max]="scale.max" [min]="scale.min" class="slider" type="range">
</div>

<main (wheel)="scroll($event.deltaX, $event.deltaY, $event.shiftKey)"
      [style.--sky-width]="sky_width"
      [style.--sky-height]="sky_height"
      [style.--dx]="dx() * scale()"
      [style.--dy]="dy() * scale()"
      [style.--gridx]="grid_width()"
      [style.--gridy]="grid_height()"
      [style.--scale]="scale()"
      (mousemove)="$event.buttons === 1 && scroll(-$event.movementX, -$event.movementY)"
>
  @if (scale() > 0) {
    @for (item of grid(); track item.idx) {
      @if (item.is_displayed) {
        <app-sky/>
      } @else {
        <div class="sky hidden"></div>
      }
    }
  }

</main>
